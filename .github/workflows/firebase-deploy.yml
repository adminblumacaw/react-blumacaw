name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  # Also validate pull requests, so a bad Lovable port is caught before merge
  # rather than after it has already deployed.
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # Gate. Runs on both PRs and pushes to main; deploy waits on it.
  # check:export encodes the regressions every Lovable export has reintroduced
  # (asset stubs, stale prerender, deleted routes, reinstated invalid schema).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check export integrity
        run: npm run check:export

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (verifies SSR prerender of every route)
        run: npm run build

  build-and-deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-action-1248138855@blumacawtech-launchpad.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project blumacawtech-launchpad

      - name: Ping IndexNow (Bing / ChatGPT search index)
        run: node scripts/indexnow-ping.mjs
        continue-on-error: true
